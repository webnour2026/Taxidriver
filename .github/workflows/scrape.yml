name: Télécharger épisodes Larbi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les pages
        run: |
          set +e
          mkdir -p episodes
          echo "" > echec.txt
          for i in $(seq 1 49); do
            wget --tries=3 --timeout=15 --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "http://www.geocities.ws/gmgazi/e${i}.html" -O "episodes/episode_${i}.html"
            if [ $? -ne 0 ]; then
              echo "Episode $i : échec" >> echec.txt
              rm -f "episodes/episode_${i}.html"
            fi
            sleep 1
          done
          echo "----- Résumé -----"
          cat echec.txt
          echo "Fichiers téléchargés :"
          ls episodes/ | wc -l

      - name: Corriger l'encodage (mojibake)
        run: |
          pip install ftfy --quiet
          python3 - <<'EOF'
          import glob, ftfy
          for path in glob.glob("episodes/*.html"):
              with open(path, "r", encoding="utf-8", errors="replace") as f:
                  content = f.read()
              fixed = ftfy.fix_text(content)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(fixed)
          print("Encodage corrigé pour tous les fichiers.")
          EOF

      - name: Commit et push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add episodes/
          git commit -m "Ajout des épisodes" || echo "Rien à commiter"
          git push
