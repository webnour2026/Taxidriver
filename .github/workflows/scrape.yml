name: Télécharger épisodes Larbi

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les pages
        run: |
          set +e
          mkdir -p episodes
          echo "" > echec.txt
          for i in $(seq 1 49); do
            wget --tries=3 --timeout=15 "http://www.geocities.ws/gmgazi/e${i}.html" -O "episodes/episode_${i}.html"
            if [ $? -ne 0 ]; then
              echo "Episode $i : échec" >> echec.txt
              rm -f "episodes/episode_${i}.html"
            fi
            sleep 1
          done
          echo "----- Résumé -----"
          cat echec.txt
          echo "Fichiers téléchargés :"
          ls episodes/ | wc -l

      - name: Commit et push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add episodes/
          git commit -m "Ajout des épisodes" || echo "Rien à commiter"
          git push
