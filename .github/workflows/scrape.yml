name: Télécharger épisodes Larbi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les pages
        run: |
          set +e
          mkdir -p episodes
          echo "" > echec.txt
          for i in $(seq 1 49); do
            wget --tries=3 --timeout=15 --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" "http://www.geocities.ws/gmgazi/e${i}.html" -O "episodes/episode_${i}.html"
            if [ $? -ne 0 ]; then
              echo "Episode $i : échec" >> echec.txt
              rm -f "episodes/episode_${i}.html"
            fi
            sleep 1
          done
          echo "----- Résumé -----"
          cat echec.txt
          echo "Fichiers téléchargés :"
          ls episodes/ | wc -l

      - name: Corriger l'encodage (Windows-1252 -> UTF-8)
        run: |
          python3 -c "
          import glob
          for path in glob.glob('episodes/*.html'):
              with open(path, 'rb') as f:
                  raw = f.read()
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  text = raw.decode('windows-1252', errors='replace')
              if '<meta charset' not in text.lower() and '<head' in text.lower():
                  text = text.replace('<head>', '<head><meta charset=\"UTF-8\">', 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(text)
          print('Encodage corrige pour tous les fichiers.')
          "

      - name: Commit et push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add episodes/
          git commit -m "Ajout des épisodes" || echo "Rien à commiter"
          git push
