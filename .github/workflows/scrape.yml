name: Télécharger épisodes Larbi

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger les pages
        run: |
          mkdir -p episodes
          for i in $(seq 1 49); do
            wget "http://www.geocities.ws/gmgazi/e${i}.html" -O "episodes/episode_${i}.html"
            sleep 1
          done

      - name: Commit et push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add episodes/
          git commit -m "Ajout des épisodes" || echo "Rien à commiter"
          git push
